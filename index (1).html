const frac=a=>a[0]+'/'+a[1];
const num=x=>x==null?'–':(Math.round(x*10)/10).toString().replace('.',',');
const sgn=x=>x==null?'–':(x>0?'+':x<0?'−':'')+Math.abs(x);
const MON=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const dshort=d=>{const [y,m,dd]=d.split('-');return (+dd)+' '+MON[+m-1];};
const LEGNAME={S:'Enkel',D:'Dubbel',B:'Bierronde'};
const BALL=['#F2C230','#1E4FA8','#C9302C','#5B2D8C','#E8742A','#1C7A45','#7A2430','#1A1A1A','#F2C230'];
function ball(n,won,title,size){size=size||30;const c=BALL[n-1];const r=size/2;
  let body;
  if(!won) body=`<circle cx="${r}" cy="${r}" r="${r-1.5}" fill="none" stroke="var(--line-strong)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${r}" y="${r+4}" text-anchor="middle" font-size="${size*.36}" fill="var(--muted)" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="600">${n}</text>`;
  else if(n===9){const cid='cp9_'+(++BALLID);body=`<clipPath id="${cid}"><circle cx="${r}" cy="${r}" r="${r-.5}"/></clipPath><circle cx="${r}" cy="${r}" r="${r-.5}" fill="#FBFAF4"/><rect x="0" y="${size*.22}" width="${size}" height="${size*.56}" fill="${c}" clip-path="url(#${cid})"/><circle cx="${r}" cy="${r}" r="${size*.24}" fill="#FBFAF4"/><text x="${r}" y="${r+4}" text-anchor="middle" font-size="${size*.36}" fill="#1A1A1A" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700">9</text>`;}
  else body=`<circle cx="${r}" cy="${r}" r="${r-.5}" fill="${c}"/><circle cx="${r}" cy="${r}" r="${size*.24}" fill="#FBFAF4"/><text x="${r}" y="${r+4}" text-anchor="middle" font-size="${size*.36}" fill="#1A1A1A" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700">${n}</text><ellipse cx="${r*.62}" cy="${r*.55}" rx="${size*.09}" ry="${size*.05}" fill="#fff" opacity=".45"/>`;
  return `<svg class="ball" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${h(title||'')}"><title>${h(title||'')}</title>${body}</svg>`;}
const legNo=l=>l.type==='S'?l.n:l.type==='D'?4+l.n:9;

let DATA=JSON.parse(document.getElementById('data').textContent);
let VIEW={tab:'overzicht',sort:{key:'pts',dir:-1},player:null,open:{},pending:[],status:'',saveMode:'checking'};
try{const t=sessionStorage.getItem('k2-tab');if(t)VIEW.tab=t;}catch(e){}
let ART=null;let BALLID=0;
function teams(){const s=new Set();DATA.matches.forEach(m=>{s.add(m.home);s.add(m.away)});return [...s].sort();}

function kpi(label,val,sub){return `<div class="kpi"><div class="kpi-v">${val}</div><div class="kpi-l">${h(label)}</div>${sub?`<div class="kpi-s">${sub}</div>`:''}</div>`;}
function bar(v,max,cls){const w=max?Math.max(0,Math.min(1,v/max))*100:0;return `<span class="bar ${cls||''}"><i style="width:${w}%"></i></span>`;}

function rack(R){
  if(!R.T.perMatch.length)return '<p class="empty">Nog geen wedstrijden. Voeg er een toe via het tabblad Toevoegen.</p>';
  return `<div class="rack">${R.T.perMatch.slice().reverse().map(mr=>{
    const legs=mr.legs.slice().sort((a,b)=>legNo(a.leg)-legNo(b.leg));
    const res=mr.pf>mr.pa?'win':'loss';
    return `<button class="rack-row" data-goto="${h(mr.m.id)}"><span class="rack-date">${dshort(mr.m.date)}</span>
      <span class="rack-opp">${mr.side==='H'?'':'@ '}${h(mr.opp)}</span>
      <span class="rack-balls">${legs.map(L=>ball(legNo(L.leg),L.won,LEGNAME[L.leg.type]+(L.leg.type!=='B'?' '+L.leg.n:'')+': '+(L.won?'gewonnen ':'verloren ')+L.fw+'-'+L.fl,26)).join('')}</span>
      <span class="rack-score ${res}">${mr.pf}–${mr.pa}${mr.bonus?'<small class="bonus" title="Bonuspunt voor de ranking">+1</small>':''}</span></button>`}).join('')}</div>
    <p class="note">Elke bal is een winstpunt: 1–4 enkels, 5–8 dubbels, 9 de bierronde. Gekleurd is gewonnen. Een gewonnen partij (5 of meer winstpunten) levert een bonuspunt op voor de ranking.</p>`;}

function pointsChart(R){
  const pm=R.T.perMatch;if(!pm.length)return '';
  const W=Math.max(320,pm.length*56),H=180,pad=28,bw=Math.min(34,(W-pad*2)/pm.length-12);
  const y=v=>H-24-(v/10)*(H-48);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Punten per wedstrijd">`;
  for(let g=0;g<=9;g+=3)s+=`<line x1="${pad}" x2="${W-8}" y1="${y(g)}" y2="${y(g)}" class="grid"/><text x="${pad-6}" y="${y(g)+4}" text-anchor="end" class="ax">${g}</text>`;
  s+=`<line x1="${pad}" x2="${W-8}" y1="${y(4.5)}" y2="${y(4.5)}" class="mid"/>`;
  pm.forEach((mr,i)=>{const x=pad+10+i*((W-pad-18)/pm.length);let b=0;
    [['sp','c-s'],['dp','c-d'],['bp','c-b'],['bonus','c-x']].forEach(([k,c])=>{const v=mr[k];if(v){s+=`<rect x="${x}" y="${y(b+v)}" width="${bw}" height="${y(b)-y(b+v)}" class="${c}"><title>${h(mr.opp)}: ${v}</title></rect>`;b+=v;}});
    s+=`<text x="${x+bw/2}" y="${y(b)-5}" text-anchor="middle" class="val">${mr.rp}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" class="ax">${dshort(mr.m.date)}</text>`;});
  s+='</svg>';
  return `<div class="scroll">${s}</div><div class="legend"><span><i class="c-s"></i>Enkels</span><span><i class="c-d"></i>Dubbels</span><span><i class="c-b"></i>Bierronde</span><span><i class="c-x"></i>Bonus</span><span><i class="mid-l"></i>Grens 4,5</span></div>`;}

const LINECOL=['var(--l1)','var(--l2)','var(--l3)','var(--l4)','var(--l5)','var(--l6)','var(--l7)'];
function lineChart(series,opts){opts=opts||{};
  const all=series.flatMap(s=>s.pts);if(!all.length)return '';
  const dates=[...new Set(all.map(p=>p.date))].sort();
  const W=Math.max(320,dates.length*60+60),H=opts.h||200,l=44,r=70,t=14,b=24;
  let lo=Math.min(...all.map(p=>p.r)),hi=Math.max(...all.map(p=>p.r));if(hi-lo<40){lo-=20;hi+=20;}
  const X=d=>l+(dates.length<2?(W-l-r)/2:dates.indexOf(d)*(W-l-r)/(dates.length-1)),Y=v=>t+(hi-v)/(hi-lo)*(H-t-b);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${h(opts.label||'Rating')}">`;
  const step=Math.ceil((hi-lo)/4/10)*10||10;
  for(let g=Math.ceil(lo/step)*step;g<=hi;g+=step)s+=`<line x1="${l}" x2="${W-r}" y1="${Y(g)}" y2="${Y(g)}" class="grid"/><text x="${l-6}" y="${Y(g)+4}" text-anchor="end" class="ax">${g}</text>`;
  dates.forEach(d=>s+=`<text x="${X(d)}" y="${H-6}" text-anchor="middle" class="ax">${dshort(d)}</text>`);
  series.forEach((se,i)=>{const c=se.color||LINECOL[i%LINECOL.length];const p=se.pts;
    s+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${p.map(q=>X(q.date)+','+Y(q.r)).join(' ')}"/>`;
    p.forEach(q=>s+=`<circle cx="${X(q.date)}" cy="${Y(q.r)}" r="3.5" fill="${c}"><title>${h(se.name)} ${dshort(q.date)}: ${q.r}${q.d!=null?' ('+sgn(q.d)+')':''}</title></circle>`);
    const lp=p[p.length-1];s+=`<text x="${X(lp.date)+8}" y="${Y(lp.r)+4}" class="lab" fill="${c}">${h(se.name)} ${lp.r}</text>`;});
  return `<div class="scroll">${s}</svg></div>`;}

function leaders(R){
  const pl=R.players.filter(p=>p.n>0);if(!pl.length)return '';
  const best=(f,min,fmt,label,sub)=>{const c=pl.filter(min).sort((a,b)=>f(b)-f(a))[0];return c?`<li><span class="ld-l">${label}</span><span class="ld-n">${h(c.name)}</span><span class="ld-v">${fmt(c)}</span>${sub?`<span class="ld-s">${sub(c)}</span>`:''}</li>`:''};
  const pr=R.pairs.filter(p=>p.w+p.l>=2).sort((a,b)=>(b.w/(b.w+b.l))-(a.w/(a.w+a.l))||b.w-a.w)[0];
  return `<ul class="leaders">
   ${best(p=>p.pts,p=>1,p=>num(p.pts)+' ptn','Meeste punten',p=>num(p.pts/p.n)+' per wedstrijd')}
   ${best(p=>p.S.w/(p.S.w+p.S.l||1)+p.S.w/100,p=>p.S.w+p.S.l>=2,p=>p.S.w+'–'+p.S.l,'Beste enkelspeler',p=>pf([p.S.w,p.S.w+p.S.l])+' gewonnen')}
   ${best(p=>p.own[0]/(p.own[1]||1),p=>p.own[1]>=6,p=>pf(p.own),'Sterkst op eigen break',p=>frac(p.own)+' frames')}
   ${best(p=>p.opp[0]/(p.opp[1]||1),p=>p.opp[1]>=6,p=>pf(p.opp),'Beste op break tegenstander',p=>frac(p.opp)+' frames')}
   ${best(p=>p.dec[0]/(p.dec[1]||1)+p.dec[0]/100,p=>p.dec[1]>=3,p=>frac(p.dec),'Koelste in frame 3',p=>pf(p.dec)+' beslissende frames')}
   ${best(p=>p.comeback,p=>1,p=>p.comeback+'×','Meeste comebacks',()=>'leg gewonnen na verlies frame 1')}
   ${best(p=>p.upsets,p=>1,p=>p.upsets+'×','Meeste stunts',()=>'enkel gewonnen van hoger gerate')}
   ${best(p=>p.expA-p.exp,p=>p.expN>=2,p=>sgn1(p.expA-p.exp),'Meest boven verwachting',p=>p.expA+' enkels gewonnen, '+num(p.exp)+' verwacht op rating')}
   ${best(p=>p.n?p.pts/p.n:0,p=>p.n>=2,p=>num(p.pts/p.n),'Hoogste gemiddelde',p=>'punten per gespeelde wedstrijd')}
   ${pr?`<li><span class="ld-l">Beste koppel</span><span class="ld-n">${h(pr.key)}</span><span class="ld-v">${pr.w}–${pr.l}</span><span class="ld-s">${pf([pr.w,pr.w+pr.l])} gewonnen</span></li>`:''}
  </ul>`;}

function tabOverzicht(R){const T=R.T;
  const posRow=(k,label)=>{const a=T.pos[k]||[0,0];return `<tr><th>${label}</th><td>${a[0]}–${a[1]-a[0]}</td><td>${bar(a[0],a[1])} ${pf(a)}</td></tr>`;};
  return `<section><h2>Alle wedstrijden</h2>${rack(R)}</section>
  <section class="kpis">
    ${kpi('Rankingpunten',T.rp||0,T.pf+' winstpunten + '+T.w+' bonus, gem. '+num(T.n?(T.rp||0)/T.n:null)+' per wedstrijd, tegen '+(T.ra||0))}
    ${kpi('Enkels',T.S[0]+'–'+(T.S[1]-T.S[0]),pf(T.S)+' gewonnen')}
    ${kpi('Dubbels',T.D[0]+'–'+(T.D[1]-T.D[0]),pf(T.D)+' gewonnen')}
    ${kpi('Bierronde',T.B[0]+'–'+(T.B[1]-T.B[0]),pf(T.B)+' gewonnen')}
    ${kpi('Frames',pf(T.frames),frac(T.frames)+' gewonnen')}
    ${kpi('Op eigen break',pf(T.own),frac(T.own)+' frames')}
    ${kpi('Op break tegenstander',pf(T.opp),frac(T.opp)+' frames')}
    ${kpi('Frame 3 (beslissend)',pf(T.dec),frac(T.dec)+' gewonnen')}
  </section>
  <section><h2>Rankingpunten per wedstrijd</h2>${pointsChart(R)}</section>
  <section><h2>Uitblinkers</h2>${leaders(R)}</section>
  <section class="two">
   <div><h2>Per leg</h2><div class="scroll"><table class="t compact"><tbody>
    ${[1,2,3,4].map(n=>posRow('S'+n,'Enkel '+n)).join('')}${[1,2,3,4].map(n=>posRow('D'+n,'Dubbel '+n)).join('')}${posRow('B1','Bierronde')}
   </tbody></table></div></div>
   <div><h2>Legverloop</h2><div class="scroll"><table class="t compact"><tbody>
    <tr><th>Gewonnen 2–0</th><td>${T.w20}</td></tr><tr><th>Gewonnen 2–1</th><td>${T.w21}</td></tr>
    <tr><th>Verloren 1–2</th><td>${T.l12}</td></tr><tr><th>Verloren 0–2</th><td>${T.l02}</td></tr>
    <tr><th>Leg gewonnen na winst frame 1</th><td>${pf(T.afterF1win)} <span class="muted">(${frac(T.afterF1win)})</span></td></tr>
    <tr><th>Leg gewonnen na verlies frame 1</th><td>${pf(T.afterF1loss)} <span class="muted">(${frac(T.afterF1loss)})</span></td></tr>
    <tr><th>Thuis</th><td>${T.home.w}–${T.home.n-T.home.w}, ${num(T.home.n?T.home.pf/T.home.n:null)} ptn gem.</td></tr>
    <tr><th>Uit</th><td>${T.away.w}–${T.away.n-T.away.w}, ${num(T.away.n?T.away.pf/T.away.n:null)} ptn gem.</td></tr>
    <tr><th>Ratingsaldo team</th><td>${sgn(T.elo)}</td></tr>
   </tbody></table></div></div>
  </section>`;}

const COLS=[
 ['name','Speler',p=>`<button class="link" data-player="${h(p.name)}">${h(p.name)}${p.role==='c'?' <span class="tag">C</span>':''}</button>`,p=>p.name],
 ['n','Gesp.',p=>p.n,p=>p.n],
 ['pts','Ptn',p=>num(p.pts),p=>p.pts],
 ['ppm','Ptn/w',p=>num(p.n?p.pts/p.n:null),p=>p.n?p.pts/p.n:-1],
 ['share','Betrokken',p=>P0(p.share),p=>p.share],
 ['sw','Enkel',p=>p.S.w+'–'+p.S.l,p=>p.S.w-p.S.l/10],
 ['sp','Enkel %',p=>pf([p.S.w,p.S.w+p.S.l]),p=>(p.S.w+p.S.l)?p.S.w/(p.S.w+p.S.l):-1],
 ['sf','Frames E',p=>p.S.fw+'–'+p.S.fl,p=>p.S.fw-p.S.fl],
 ['dw','Dubbel',p=>p.D.w+'–'+p.D.l,p=>p.D.w-p.D.l/10],
 ['dp','Dubbel %',p=>pf([p.D.w,p.D.w+p.D.l]),p=>(p.D.w+p.D.l)?p.D.w/(p.D.w+p.D.l):-1],
 ['fp','Frame %',p=>pf(p.frames),p=>p.frames[1]?p.frames[0]/p.frames[1]:-1],
 ['own','Eigen break',p=>pf(p.own)+` <span class="muted">${frac(p.own)}</span>`,p=>p.own[1]?p.own[0]/p.own[1]:-1],
 ['opp','Break tegen',p=>pf(p.opp)+` <span class="muted">${frac(p.opp)}</span>`,p=>p.opp[1]?p.opp[0]/p.opp[1]:-1],
 ['dec','Frame 3',p=>frac(p.dec),p=>p.dec[1]?p.dec[0]/p.dec[1]:-1],
 ['cb','Comeb.',p=>p.comeback,p=>p.comeback],
 ['w20','2–0',p=>p.w20,p=>p.w20],
 ['up','Stunts',p=>p.upsets,p=>p.upsets],
 ['f1','Frame 1 %',p=>pf(p.f1),p=>p.f1[1]?p.f1[0]/p.f1[1]:-1],
 ['exp','Boven verw.',p=>p.expN?sgn1(p.expA-p.exp):'–',p=>p.expN?p.expA-p.exp:-99],
 ['or','Gem. tegenst.',p=>p.oppR[1]?Math.round(p.oppR[0]/p.oppR[1]):'–',p=>p.oppR[1]?p.oppR[0]/p.oppR[1]:-1],
 ['rating','Rating',p=>p.rating??'–',p=>p.rating||0],
 ['dr','Δ seizoen',p=>`<span class="${p.dRating>0?'pos':p.dRating<0?'neg':''}">${sgn(p.dRating)}</span>`,p=>p.dRating||0],
];
function tabSpelers(R){
  const s=VIEW.sort,col=COLS.find(c=>c[0]===s.key)||COLS[2];
  const pl=R.players.slice().sort((a,b)=>{const x=col[3](a),y=col[3](b);return (typeof x==='string'?x.localeCompare(y):x-y)*s.dir;});
  const tbl=`<div class="scroll"><table class="t players"><thead><tr>${COLS.map(c=>`<th><button class="sort ${c[0]===s.key?'on':''}" data-sort="${c[0]}">${h(c[1])}${c[0]===s.key?(s.dir<0?' ▾':' ▴'):''}</button></th>`).join('')}</tr></thead>
   <tbody>${pl.map(p=>`<tr class="${VIEW.player===p.name?'sel':''}">${COLS.map((c,i)=>i===0?`<th>${c[2](p)}</th>`:`<td>${c[2](p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="explain"><h3>Zo worden de punten berekend</h3><p>Elke gewonnen enkel of dubbel levert 1 punt op; bij een dubbel krijgen beide spelers het punt. Wie die avond meespeelt, krijgt daarnaast 1 punt als de bierronde gewonnen wordt en 1 bonuspunt als de partij gewonnen wordt (5 of meer winstpunten). Ptn/w is het totaal gedeeld door het aantal wedstrijden waarin de speler meespeelde; avonden als reserve tellen niet mee.</p><p><b>Betrokken:</b> bij welk deel van alle gewonnen enkels en dubbels van het team de speler aan tafel stond. <b>Eigen break / Break tegen:</b> winst% van frames waarin wij, respectievelijk de tegenstander, braken. <b>Frame 3:</b> beslissende frames gewonnen. <b>Comeb.:</b> leg gewonnen na verlies van frame 1. <b>Frame 1 %:</b> hoe vaak de speler de openingsframe van een leg wint. <b>Stunt:</b> enkel gewonnen van een tegenstander met een hogere rating vooraf. <b>Boven verw.:</b> gewonnen enkels min het aantal dat volgens de ratings vooraf te verwachten was (Elo-formule); positief betekent beter dan de rating voorspelt. <b>Gem. tegenst.:</b> gemiddelde rating van de tegenstanders in de enkels.</p></div>`;
  const series=R.players.filter(p=>p.ratings.length).map(p=>({name:p.name,pts:p.ratings.map(q=>({date:q.date,r:q.r,d:q.d}))}));
  const sel=R.players.find(p=>p.name===VIEW.player);
  return `<section><h2>Spelers</h2>${tbl}</section>${sel?playerCard(sel,R):'<p class="note">Tik op een naam voor het spelersprofiel.</p>'}<section><h2>Punten per avond</h2>${pointsGrid(R)}</section><section><h2>Ratingverloop</h2>${lineChart(series)}</section>`;}

const sgn1=x=>(x>0.05?'+':x<-0.05?'−':'')+num(Math.abs(x));
function pointsGrid(R){const ms=R.T.perMatch;if(!ms.length)return '';const pl=R.players.slice().sort((a,b)=>b.pts-a.pts);
  return `<div class="scroll"><table class="t matrix"><thead><tr><th>Speler</th>${ms.map(mr=>`<th>${dshort(mr.m.date)}<br><span class="muted">${h(mr.opp)}</span></th>`).join('')}<th>Totaal</th></tr></thead><tbody>
  ${pl.map(p=>`<tr><th>${h(p.name)}</th>${ms.map(mr=>{const v=p.perMatch[mr.m.id];if(v==null)return `<td class="na">${p.ratings.some(r=>r.date===mr.m.date)?'R':'–'}</td>`;return `<td class="heat" style="--r:${Math.min(1,v/5)}">${v}</td>`;}).join('')}<th>${p.pts}</th></tr>`).join('')}
  </tbody></table></div><p class="note">Punten per speler per avond, inclusief bierronde en bonuspunt. R = reserve, niet gespeeld.</p>`;}
function playerCard(p,R){
  const posKeys=Object.keys(p.pos).sort((a,b)=>(a[0]==='S'?0:4)+ +a.slice(1)-((b[0]==='S'?0:4)+ +b.slice(1)));
  return `<section class="card" id="profile"><div class="card-head"><h2>${h(p.name)}</h2><button class="x" data-player="" aria-label="Sluit profiel">Sluiten</button></div>
   <div class="kpis small">
    ${kpi('Punten',num(p.pts),p.ptS+' enkel + '+p.ptD+' dubbel + '+p.ptB+' bier + '+p.ptX+' bonus; '+num(p.n?p.pts/p.n:null)+' per wedstrijd ('+p.n+' gespeeld)')}
    ${kpi('Enkels',p.S.w+'–'+p.S.l,'frames '+p.S.fw+'–'+p.S.fl)}
    ${kpi('Dubbels',p.D.w+'–'+p.D.l,'frames '+p.D.fw+'–'+p.D.fl)}
    ${kpi('Eigen break',pf(p.own),frac(p.own))}
    ${kpi('Break tegen',pf(p.opp),frac(p.opp))}
    ${kpi('Rating',p.rating??'–',sgn(p.dRating)+' dit seizoen')}
   </div>
   ${p.singles.length?`<h3>Enkels</h3><div class="scroll"><table class="t compact"><thead><tr><th>Datum</th><th>Tegenstander</th><th>Rating (verschil)</th><th>Uitslag</th><th>Δ rating</th></tr></thead><tbody>
    ${p.singles.slice().reverse().map(s=>`<tr><td>${dshort(s.date)}</td><td>${h(s.opp)} <span class="muted">${h(s.oppTeam)}</span></td><td>${s.opR??'–'}${s.myR!=null&&s.opR!=null?` <span class="muted">(${sgn(s.opR-s.myR)})</span>`:''}</td><td><span class="${s.won?'pos':'neg'}">${s.fw}–${s.fl}</span></td><td>${sgn(s.delta)}</td></tr>`).join('')}
   </tbody></table></div>`:''}
   <div class="two"><div><h3>Partners</h3><table class="t compact"><tbody>${Object.entries(p.partners).sort((a,b)=>b[1][1]-a[1][1]).map(([n,a])=>`<tr><th>${h(n)}</th><td>${a[0]}–${a[1]-a[0]}</td><td>${pf(a)}</td></tr>`).join('')||'<tr><td>Nog geen dubbels</td></tr>'}</tbody></table></div>
   <div><h3>Per leg</h3><table class="t compact"><tbody>${posKeys.map(k=>`<tr><th>${LEGNAME[k[0]]} ${k.slice(1)}</th><td>${p.pos[k][0]}–${p.pos[k][1]-p.pos[k][0]}</td></tr>`).join('')}</tbody></table></div></div>
   <h3>Rating</h3>${lineChart([{name:p.name,pts:p.ratings},],{h:160})}
  </section>`;}

function tabDubbels(R){
  const pr=R.pairs.slice().sort((a,b)=>(b.w-b.l)-(a.w-a.l)||b.w-a.w);
  return `<section><h2>Koppels</h2><div class="scroll"><table class="t"><thead><tr><th>Koppel</th><th>Gesp.</th><th>W–V</th><th>Winst %</th><th>Frames</th><th>Eigen break</th><th>Break tegen</th><th>Frame 3</th></tr></thead><tbody>
   ${pr.map(p=>`<tr><th>${h(p.key)}</th><td>${p.w+p.l}</td><td>${p.w}–${p.l}</td><td>${bar(p.w,p.w+p.l)} ${pf([p.w,p.w+p.l])}</td><td>${p.fw}–${p.fl}</td><td>${pf(p.own)} <span class="muted">${frac(p.own)}</span></td><td>${pf(p.opp)} <span class="muted">${frac(p.opp)}</span></td><td>${frac(p.dec)}</td></tr>`).join('')}
  </tbody></table></div></section>
  <section><h2>Partnermatrix</h2>${matrix(R)}</section>`;}
function matrix(R){
  const names=R.players.filter(p=>p.D.w+p.D.l).map(p=>p.name);if(!names.length)return '<p class="empty">Nog geen dubbels.</p>';
  return `<div class="scroll"><table class="t matrix"><thead><tr><th></th>${names.map(n=>`<th>${h(n)}</th>`).join('')}</tr></thead><tbody>
   ${names.map(a=>`<tr><th>${h(a)}</th>${names.map(b=>{if(a===b)return '<td class="na"></td>';const pr=R.pairs.find(p=>p.names.includes(a)&&p.names.includes(b));
     if(!pr)return '<td class="na">–</td>';const r=pr.w/(pr.w+pr.l);return `<td style="--r:${r}" class="heat">${pr.w}–${pr.l}</td>`;}).join('')}</tr>`).join('')}
  </tbody></table></div>`;}

function tabBreak(R){const T=R.T;
  const fr=(side,i)=>{const a=T.fno[side][i];return `<td>${pf(a)} <span class="muted">${frac(a)}</span></td>`;};
  const pl=R.players.filter(p=>p.own[1]+p.opp[1]>0);
  const mx=1;
  return `<section><h2>Wie breekt wanneer</h2>
   <p class="lede">Het uitspelende team breekt frame 1 en 3, het thuisteam frame 2. Thuis spelen we dus twee keer op de break van de tegenstander, uit twee keer op onze eigen break.</p>
   <div class="scroll"><table class="t"><thead><tr><th></th><th>Frame 1</th><th>Frame 2</th><th>Frame 3</th></tr></thead><tbody>
    <tr><th>Thuis</th>${fr('H',0)}${fr('H',1)}${fr('H',2)}</tr>
    <tr class="sub"><th></th><td>tegenstander breekt</td><td>wij breken</td><td>tegenstander breekt</td></tr>
    <tr><th>Uit</th>${fr('A',0)}${fr('A',1)}${fr('A',2)}</tr>
    <tr class="sub"><th></th><td>wij breken</td><td>tegenstander breekt</td><td>wij breken</td></tr>
   </tbody></table></div>
   <div class="kpis small">${kpi('Eigen break, team',pf(T.own),frac(T.own))}${kpi('Break tegenstander, team',pf(T.opp),frac(T.opp))}${kpi('Bierronde, eigen break',pf(T.bOwn),frac(T.bOwn))}${kpi('Bierronde, break tegen',pf(T.bOpp),frac(T.bOpp))}</div></section>
  <section><h2>Per speler</h2><div class="breaklist">
   ${pl.sort((a,b)=>(b.own[0]/(b.own[1]||1))-(a.own[0]/(a.own[1]||1))).map(p=>`<div class="bl-row"><span class="bl-n">${h(p.name)}</span>
     <span class="bl-b"><span class="bl-lab">Eigen break</span>${bar(p.own[0],p.own[1],'b-own')}<span class="bl-v">${pf(p.own)}</span><span class="muted">${frac(p.own)}</span></span>
     <span class="bl-b"><span class="bl-lab">Break tegen</span>${bar(p.opp[0],p.opp[1],'b-opp')}<span class="bl-v">${pf(p.opp)}</span><span class="muted">${frac(p.opp)}</span></span></div>`).join('')}
  </div><p class="note">Telt alle frames in enkels en dubbels waarin de speler meespeelde.</p></section>`;}

function tabWedstrijden(R){
  if(!R.T.perMatch.length)return '<p class="empty">Nog geen wedstrijden.</p>';
  return `<section><h2>Wedstrijden</h2>${R.T.perMatch.slice().reverse().map(mr=>{const m=mr.m,open=VIEW.open[m.id];
   const legs=mr.legs;
   return `<article class="match ${mr.pf>mr.pa?'win':'loss'}" id="m-${h(m.id)}"><button class="match-h" data-toggle="${h(m.id)}" aria-expanded="${open?'true':'false'}">
     <span class="mh-date">${dshort(m.date)}</span><span class="mh-t">${h(m.home)} <b>${side_score(mr)}</b> ${h(m.away)}</span><span class="mh-v">${h(m.venue)}</span></button>
     ${open?`<div class="match-b"><div class="scroll"><table class="t legs"><thead><tr><th>Leg</th><th>Wij</th><th>Zij</th><th>Uitslag</th><th>Frames</th></tr></thead><tbody>
      ${legs.map(L=>`<tr><th>${LEGNAME[L.leg.type]}${L.leg.type!=='B'?' '+L.leg.n:''}</th><td>${h(L.our.join(' / '))}</td><td>${h(L.their.join(' / '))}</td><td><span class="${L.won?'pos':'neg'}">${L.fw}–${L.fl}</span></td>
      <td class="frames">${L.fr.map((f,i)=>`<span class="fr ${f.won?'w':'l'}" title="Frame ${i+1}: ${f.weBreak?'wij breken':'tegenstander breekt'}, ${f.won?'gewonnen':'verloren'}">${i+1}${f.weBreak?'<sup>b</sup>':''}</span>`).join('')}</td></tr>`).join('')}
     </tbody></table></div><p class="note"><sup>b</sup> = wij braken. Rankingpunten: ${mr.rp}${mr.bonus?' (inclusief bonuspunt)':''}. Ratingsaldo deze avond: ${sgn(mr.elo)}.</p>
     <div class="lineups">${['home','away'].map(sd=>`<div><h3>${h(m[sd])}</h3><ul>${m.lineup[sd].map(p=>`<li>${h(p.name)}${p.role?` <span class="tag">${p.role.toUpperCase()}</span>`:''}<span class="muted">${p.rating}${p.delta!=null?' ('+sgn(p.delta)+')':''}</span></li>`).join('')}</ul></div>`).join('')}</div>
     <button class="danger" data-del="${h(m.id)}">${VIEW.confirmDel===m.id?'Tik nogmaals om te verwijderen':'Wedstrijd verwijderen'}</button></div>`:''}</article>`;}).join('')}</section>`;}
function side_score(mr){return mr.side==='H'?mr.pf+'–'+mr.pa:mr.pa+'–'+mr.pf;}

function tabToevoegen(){
  const mode=VIEW.saveMode;
  return `<section><h2>Wedstrijd toevoegen</h2>
  <p class="lede">Download het wedstrijdformulier als pdf op poolcompetitiehilversum.nl en kies het hieronder. Meerdere bestanden tegelijk kan. Je kunt ook de tekst van het formulier kopiëren en plakken.</p>
  <label class="file"><input type="file" id="pdfs" accept="application/pdf" multiple><span>Kies pdf-bestanden</span></label>
  <label class="lbl" for="paste">Of plak de tekst</label>
  <textarea id="paste" rows="6" placeholder="Karroesel 2 4 - 5 De Barbier 2 …"></textarea>
  <button class="primary" id="parse">Tekst inlezen</button>
  ${VIEW.status?`<p class="status" role="status">${VIEW.status}</p>`:''}
  ${VIEW.pending.length?`<div class="pending"><h3>Klaar om op te slaan</h3><ul>${VIEW.pending.map((m,i)=>{const sc=m.legs.reduce((a,l)=>{const x=l.frames.filter(f=>f==='H').length,y=l.frames.filter(f=>f==='A').length;x>y?a[0]++:a[1]++;return a},[0,0]);
     const dup=DATA.matches.some(o=>o.id===m.id);
     return `<li><b>${dshort(m.date)}</b> ${h(m.home)} ${sc[0]}–${sc[1]} ${h(m.away)}${dup?' <span class="warn">vervangt bestaande</span>':''}${m.warnings.length?`<span class="warn">${h(m.warnings.join('; '))}</span>`:''} <button class="link" data-unpend="${i}">Weghalen</button></li>`}).join('')}</ul>
     <button class="primary" id="save">${VIEW.pending.length} ${VIEW.pending.length===1?'wedstrijd':'wedstrijden'} opslaan</button></div>`:''}
  <p class="note">${mode==='artifact'?'Opslaan bewaart de wedstrijden in deze pagina, zodat iedereen met de link dezelfde cijfers ziet.':mode==='readonly'?'Je kunt deze pagina alleen bekijken; opslaan kan de eigenaar.':mode==='local'?'Nieuwe wedstrijden worden eerst alleen in deze browser bewaard. Maak ze zichtbaar voor het hele team door de bijgewerkte index.html te downloaden en die op GitHub te vervangen.':'Opslagmogelijkheden worden gecontroleerd…'}</p>
  ${mode==='local'?`<div class="pending"><h3>Delen met het team</h3><p class="note">Dit bestand bevat alle ${DATA.matches.length} wedstrijden die je nu ziet.</p><button class="primary" id="dlhtml">Download index.html</button></div>`:''}
  </section>`;}

function render(){
  DATA.team='Karroesel 2';
  const R=compute(DATA.matches,DATA.team),T=R.T;
  const tabs=[['overzicht','Overzicht'],['spelers','Spelers'],['dubbels','Dubbels'],['break','Break'],['wedstrijden','Wedstrijden'],['toevoegen','Toevoegen']];
  const season=[...new Set(R.ms.map(m=>m.season).filter(Boolean))].join(', ');
  const body={overzicht:tabOverzicht,spelers:tabSpelers,dubbels:tabDubbels,break:tabBreak,wedstrijden:tabWedstrijden,toevoegen:tabToevoegen}[VIEW.tab](R);
  document.getElementById('root').innerHTML=`<header class="top"><div class="top-in">
    <div class="brand"><h1>${h(DATA.team)}</h1><p>${h(season||'Poolcompetitie Hilversum')}</p></div>
    <div class="record"><span class="rec-big">${T.w}<small>W</small> ${T.l}<small>V</small></span><span class="rec-sub">${T.rp||0} rankingpunten (${T.pf} winst + ${T.w} bonus) uit ${T.n} ${T.n===1?'wedstrijd':'wedstrijden'}${T.streak?', reeks '+T.streak:''}</span></div>
   </div></header><nav class="tabs" role="tablist"><div class="tabs-in">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${VIEW.tab===k}" data-tab="${k}">${l}</button>`).join('')}</div></nav>
   <main>${body}</main>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){VIEW.tab=b.dataset.tab;try{sessionStorage.setItem('k2-tab',VIEW.tab)}catch(_){}render();window.scrollTo(0,0);return;}
  if(b.dataset.sort){const k=b.dataset.sort;VIEW.sort=VIEW.sort.key===k?{key:k,dir:-VIEW.sort.dir}:{key:k,dir:k==='name'?1:-1};render();return;}
  if(b.dataset.player!==undefined){VIEW.player=b.dataset.player||null;render();if(VIEW.player){const el=document.getElementById('profile');el&&el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}return;}
  if(b.dataset.goto){VIEW.tab='wedstrijden';VIEW.open[b.dataset.goto]=true;render();const el=document.getElementById('m-'+b.dataset.goto);el&&el.scrollIntoView({block:'start'});return;}
  if(b.dataset.toggle){VIEW.open[b.dataset.toggle]=!VIEW.open[b.dataset.toggle];render();return;}
  if(b.dataset.unpend){VIEW.pending.splice(+b.dataset.unpend,1);render();return;}
  if(b.dataset.del){const id=b.dataset.del;if(VIEW.confirmDel!==id){VIEW.confirmDel=id;render();return;}VIEW.confirmDel=null;DATA.matches=DATA.matches.filter(x=>x.id!==id);persist('Wedstrijd verwijderd.');return;}
  if(b.id==='dlhtml'){const url=URL.createObjectURL(new Blob([buildHtml()],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);VIEW.status='index.html gedownload. Upload dit bestand naar GitHub om het te delen.';render();return;}
  if(b.id==='parse'){const v=document.getElementById('paste').value;if(!v.trim()){VIEW.status='Plak eerst de tekst van een wedstrijdformulier.';render();return;}addTexts([v]);return;}
  if(b.id==='save'){const ids=new Set(VIEW.pending.map(m=>m.id));DATA.matches=DATA.matches.filter(m=>!ids.has(m.id)).concat(VIEW.pending.map(({warnings,...m})=>m));const n=VIEW.pending.length;VIEW.pending=[];persist(n+(n===1?' wedstrijd':' wedstrijden')+' opgeslagen.');return;}
});
document.addEventListener('change',e=>{
  if(e.target.id==='team'){DATA.team=e.target.value;VIEW.player=null;render();return;}
  if(e.target.id==='pdfs'&&e.target.files.length){readPdfs([...e.target.files]);}
});
function addTexts(texts){
  const errs=[];let n=0;
  for(const t of texts)for(const part of splitDocs(t)){try{const m=parseMatchText(part);VIEW.pending=VIEW.pending.filter(p=>p.id!==m.id);VIEW.pending.push(m);n++;}catch(err){errs.push(err.message);}}
  VIEW.status=(n?n+(n===1?' wedstrijd':' wedstrijden')+' ingelezen. Controleer en sla op.':'')+(errs.length?' '+h(errs.join(' ')):'');render();}
let pdfjsP=null;
function loadPdfjs(){return pdfjsP||(pdfjsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};s.onerror=()=>{pdfjsP=null;rej(new Error('pdf-lezer kon niet laden'))};document.head.appendChild(s);}));}
async function readPdfs(files){
  VIEW.status='Pdf’s worden gelezen…';render();
  try{const lib=await loadPdfjs();const texts=[];
    for(const f of files){const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;let all=[];
      for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();
        const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5]}));
        items.sort((a,b)=>Math.abs(b.y-a.y)>2?b.y-a.y:a.x-b.x);all.push(items.map(it=>it.s).join(' '));}
      texts.push(all.join(' '));}
    addTexts(texts);
  }catch(err){VIEW.status='Pdf lezen lukte niet ('+h(err.message)+'). Kopieer de tekst uit de pdf en plak die hieronder.';render();}
}
function buildHtml(){
  const g=id=>document.getElementById(id).textContent;
  const head=g('head-src');
  const json=JSON.stringify(DATA).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="nl"><head>'+head+'<style id="css">'+g('css')+'</style></head><body><div id="root"></div>'+
   '<script type="text/plain" id="head-src">'+head+'<\/script><script type="application/json" id="data">'+json+'<\/script><script id="app">'+g('app')+'<\/script></body></html>';}
async function persist(msg){
  if(VIEW.saveMode==='artifact'&&ART){VIEW.status='Opslaan…';render();
    try{try{sessionStorage.setItem('k2-tab',VIEW.tab)}catch(_){}await ART.publish(buildHtml());VIEW.status=msg;render();}
    catch(err){if(err&&err.code==='conflict'){VIEW.status='Iemand anders heeft net opgeslagen; de pagina wordt ververst.';}
      else if(err&&(err.code==='not_writer'||err.code==='not_granted'||err.code==='consent_required')){VIEW.saveMode='readonly';VIEW.status='Je kunt deze pagina alleen bekijken; je wijziging is niet bewaard.';}
      else if(err&&err.code==='rate_limited'){VIEW.status='Even te vaak opgeslagen. Probeer het over een minuut opnieuw.';}
      else{VIEW.status='Opslaan mislukt ('+h(err&&err.code||err)+'). Probeer het opnieuw.';}render();}
    return;}
  try{localStorage.setItem('k2-matches',JSON.stringify(DATA.matches));VIEW.status=msg+' Bewaard in deze browser.';}catch(_){VIEW.status=msg+' Let op: alleen tot je de pagina sluit.';}
  render();}
try{const loc=JSON.parse(localStorage.getItem('k2-matches')||'null');if(Array.isArray(loc)){const ids=new Set(DATA.matches.map(m=>m.id));loc.forEach(m=>{if(m&&m.id&&!ids.has(m.id))DATA.matches.push(m)});}}catch(_){}
render();
(async()=>{try{ART=window.claude&&window.claude.use?await window.claude.use('artifact'):null;}catch(_){ART=null;}
  VIEW.saveMode=ART?'artifact':'local';if(VIEW.tab==='toevoegen')render();})();
</script></body></html>
